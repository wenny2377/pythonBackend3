  :root{
    --bg: #05060a;
    --bg-2: #0a0d16;
    --blue: #4c8dff;
    --cyan: #38bdf8;
    --white: #f5f7fa;
    --muted: #8b93a7;
    --card: rgba(255,255,255,0.035);
    --card-border: rgba(76,141,255,0.22);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    width:100%; height:100%;
    background: var(--bg);
    overflow:hidden;
  }

  .stage{
    position:relative;
    width:100%;
    height:100vh;
    min-height:640px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter', sans-serif;
  }

  /* ambient glow */
  .glow{
    position:absolute;
    border-radius:50%;
    filter: blur(90px);
    opacity:0.35;
    pointer-events:none;
  }
  .glow-a{
    width:520px; height:520px;
    top:-140px; left:-140px;
    background: radial-gradient(circle, var(--blue), transparent 70%);
    animation: pulseGlow 7s ease-in-out infinite;
  }
  .glow-b{
    width:460px; height:460px;
    bottom:-160px; right:-100px;
    background: radial-gradient(circle, var(--cyan), transparent 70%);
    animation: pulseGlow 7s ease-in-out infinite 1.5s;
  }
  @keyframes pulseGlow{
    0%,100%{ opacity:0.25; transform:scale(1); }
    50%{ opacity:0.45; transform:scale(1.08); }
  }

  /* faint grid texture */
  .grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(76,141,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(76,141,255,0.06) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
    opacity:0.5;
  }

  .content{
    position:relative;
    width:min(1180px, 92vw);
    display:grid;
    grid-template-columns: 340px 1fr;
    gap:64px;
    align-items:end;
  }

  /* ---- Left: mascot ---- */
  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    transform: translateY(-28px);
  }

  .mascot-wrap{
    position:relative;
    width:260px; height:260px;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    animation: mascotIn 0.9s cubic-bezier(.2,.9,.25,1) 0.15s forwards;
  }
  .mascot-ring{
    position:absolute;
    width:230px; height:230px;
    border-radius:56px;
    background: radial-gradient(circle, rgba(76,141,255,0.32), transparent 68%);
    filter: blur(10px);
    animation: ringPulse 3.2s ease-in-out 1.2s infinite;
  }
  .mascot-img{
    position:relative;
    width:230px;
    filter: drop-shadow(0 18px 40px rgba(76,141,255,0.35));
    animation: floatY 4.2s ease-in-out 1.1s infinite;
  }

  @keyframes mascotIn{
    from{ opacity:0; transform: translateY(24px) scale(0.94); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  @keyframes floatY{
    0%,100%{ transform: translateY(0px); }
    50%{ transform: translateY(-12px); }
  }
  @keyframes ringPulse{
    0%,100%{ opacity:0.5; transform: scale(1); }
    50%{ opacity:0.9; transform: scale(1.12); }
  }

  .brand-name{
    margin-top:22px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:40px;
    color: var(--white);
    letter-spacing:0.5px;
    opacity:0;
    animation: fadeUp 0.7s ease 0.55s forwards;
  }

  /* ---- Right: text ---- */
  .right{
    margin-top: 0;
  }

  .headline{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:clamp(28px, 3.2vw, 42px);
    line-height:1.35;
    color: var(--white);
    min-height: 3.2em;
  }

  .headline .accent{
    color: var(--muted);
    font-weight:400;
  }

  .cursor{
    display:inline-block;
    width:3px;
    height:1em;
    vertical-align:-0.15em;
    margin-left:2px;
    background: var(--cyan);
    animation: blink 0.9s step-start infinite;
  }
  .cursor.hide{ display:none; }
  @keyframes blink{
    50%{ opacity:0; }
  }

  .lead-line{
    display:block;
    margin-top:14px;
    color: var(--cyan);
    text-shadow: 0 0 18px rgba(56,189,248,0.55);
  }
  .lead-line .cursor{
    background: var(--cyan);
  }

  .points{
    margin-top:38px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .point{
    display:flex;
    align-items:flex-start;
    gap:16px;
    padding:18px 22px;
    border-radius:14px;
    background: var(--card);
    border:1px solid var(--card-border);
    opacity:0;
    transform: translateX(28px);
    transition: opacity 0.65s cubic-bezier(.2,.9,.25,1), transform 0.65s cubic-bezier(.2,.9,.25,1);
  }
  .point.show{
    opacity:1;
    transform: translateX(0);
  }

  .icon{
    flex:0 0 auto;
    width:10px; height:10px;
    margin-top:9px;
    border-radius:50%;
    background: var(--cyan);
    box-shadow: 0 0 8px rgba(56,189,248,0.7);
  }

  .point-text h3{
    font-family:'Space Grotesk', sans-serif;
    font-size:21px;
    font-weight:600;
    color: var(--white);
    margin-bottom:5px;
  }
  .point-text p{
    font-size:19px;
    color: var(--muted);
    font-weight:400;
    line-height:1.4;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(16px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (max-width: 820px){
    .content{ grid-template-columns: 1fr; text-align:center; }
    .points{ align-items:stretch; }
    .point{ text-align:left; }
  }

  .transition-overlay{
    position:fixed;
    inset:0;
    background: #ffffff;
    opacity:0;
    pointer-events:none;
    transition: opacity 1.4s ease;
    z-index: 50;
  }
  .transition-overlay.show{
    opacity:1;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="grid"></div>

  <div class="content">

    <div class="brand">

    <div class="right">
      <div class="headline">
        <span id="typed"></span><span class="cursor" id="cursor"></span>
        <span class="lead-line" id="lead"><span id="leadTyped"></span><span class="cursor hide" id="leadCursor"></span></span>
      </div>

      <div class="points">
        <div class="point p1">
          <div class="icon"></div>
          <div class="point-text">
            <h3>Behavior Observation</h3>
            <p>Learns your daily routines</p>
          </div>
        </div>

        <div class="point p2">
          <div class="icon"></div>
          <div class="point-text">
            <h3>Proactive Service</h3>
            <p>Acts before you ask</p>
          </div>
        </div>

        <div class="point p3">
          <div class="icon"></div>
          <div class="point-text">
            <h3>Personalized Response</h3>
            <p>Different answers for different users</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="transition-overlay" id="transitionOverlay"></div>

<script>
  const typedEl = document.getElementById('typed');
  const cursorEl = document.getElementById('cursor');
  const leadTypedEl = document.getElementById('leadTyped');
  const leadCursorEl = document.getElementById('leadCursor');
  const points = document.querySelectorAll('.point');

  const fullText = "Hi, I'm Mami — a home AI agent";
  const leadText = "Here's what I can do";
  const typeSpeed = 75;      // ms per character (slower, recording-friendly pace)
  const startDelay = 700;    // wait for mascot entrance first
  const afterTypePause = 600;
  const beforePointsPause = 1200;
  const betweenPointsPause = 2200;

  function typeInto(el, text, speed, onDone){
    let idx = 0;
    (function step(){
      if(idx <= text.length){
        el.textContent = text.slice(0, idx);
        idx++;
        setTimeout(step, speed);
      } else if(onDone){
        onDone();
      }
    })();
  }

  function startHeadline(){
    typeInto(typedEl, fullText, typeSpeed, onHeadlineDone);
  }

  function onHeadlineDone(){
    cursorEl.classList.add('hide');
    setTimeout(startLead, afterTypePause);
  }

  function startLead(){
    leadCursorEl.classList.remove('hide');
    typeInto(leadTypedEl, leadText, typeSpeed, onLeadDone);
  }

  function onLeadDone(){
    leadCursorEl.classList.add('hide');
    setTimeout(()=> revealPoint(0), beforePointsPause);
  }

  function revealPoint(idx){
    if(idx >= points.length){
      setTimeout(()=>{
        document.getElementById('transitionOverlay').classList.add('show');
      }, 2200);
      return;
    }
    points[idx].classList.add('show');
    setTimeout(()=> revealPoint(idx+1), betweenPointsPause);
  }

  setTimeout(startHeadline, startDelay);
</script>
